{% extends "base.html" %}
{% block content %}
<form method="POST" style="max-width: 400px; margin: 0 auto;">
    <h1 style="text-align: center; margin-bottom: 20px;">{{ t('login.title') }}</h1>
    <input type="text" name="username" placeholder="{{ t('login.username') }}" required>
    <input type="password" name="password" placeholder="{{ t('login.password') }}" required>
    <div style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="remember" name="remember" style="width: auto;">
        <label for="remember">{{ t('login.remember_me') }}</label>
    </div>
    <input type="submit" value="{{ t('login.button') }}">
</form>
{% endblock %}
