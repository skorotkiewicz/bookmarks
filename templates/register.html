{% extends "base.html" %}
{% block content %}
<h1 style="text-align: center;">{{ t('register.title') }}</h1>
<form method="POST">
    <input type="text" name="username" placeholder="{{ t('register.username') }}" required>
    <input type="email" name="email" placeholder="{{ t('register.email') }}" required>
    <input type="password" name="password" placeholder="{{ t('register.password') }}" required>
    <input type="submit" value="{{ t('register.button') }}">
</form>
{% endblock %}
